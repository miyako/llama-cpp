theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge
plugins_dir: _plugins
baseurl: /llama-cpp

title: "llama.cpp"
description: "The standard for local inference. Run GGUF models on macOS and Windows with 4D."
url: "https://miyako.github.io"
logo: "/assets/logo.png"
github:
  is_user_page: true
  owner_url: "https://github.com/miyako"
  repository_url: "https://github.com/miyako/llama-cpp"
  is_project_page: false

exclude:
  - "SITE-DESIGN.md"
  - "vendor"
  - "resources"
  - "LICENSE"
  - "README.md"
  - "Gemfile"
  - "llama-cpp/*"
  - "lib/*"
  - "include/*"
  - "bin/*"
  - "a/*"
  - "package.json"
  - "prism-ml/*"
