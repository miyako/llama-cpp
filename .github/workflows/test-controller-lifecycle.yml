name: Controller lifecycle characterization

on:
  pull_request:
    paths:
      - 'llama-cpp/Project/Sources/Classes/_CLI_Controller.4dm'
      - 'llama-cpp/Documentation/Classes/_CLI_Controller.md'
      - 'scripts/test-controller-lifecycle.py'
      - 'scripts/test-download-integrity.py'
      - 'tests/controller/**'
      - 'tests/compiler/**'
      - 'tests/test_controller_lifecycle_tools.py'
      - '.github/workflows/test-controller-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'llama-cpp/Project/Sources/Classes/_CLI_Controller.4dm'
      - 'llama-cpp/Documentation/Classes/_CLI_Controller.md'
      - 'scripts/test-controller-lifecycle.py'
      - 'scripts/test-download-integrity.py'
      - 'tests/controller/**'
      - 'tests/compiler/**'
      - 'tests/test_controller_lifecycle_tools.py'
      - '.github/workflows/test-controller-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-characterization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterize:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict evidence gates
        run: python3 -m unittest discover -s tests -p 'test_controller_lifecycle_tools.py'
      - name: Provision checksum-pinned 20.8 engine
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p .build/tool-downloads .build/tool4d
          curl -fL --retry 2 --max-time 120 \
            https://resources-download.4d.com/release/20.x/20.8/latest/mac/tool4d_arm64.tar.xz \
            -o .build/tool-downloads/tool4d.tar.xz
          echo 'da9c977dd85d4ee506a5d0c115f17d9f27ea487f402f0d642f4f2e1b186b560d  .build/tool-downloads/tool4d.tar.xz' | shasum -a 256 -c -
          tar -xJf .build/tool-downloads/tool4d.tar.xz -C .build/tool4d
          codesign --verify --strict .build/tool4d/tool4d.app
          .build/tool4d/tool4d.app/Contents/MacOS/tool4d --version
      - name: Compile and verify accepted lifecycle plus idle rejection
        run: |
          python3 scripts/test-controller-lifecycle.py \
            --tool4d "$PWD/.build/tool4d/tool4d.app/Contents/MacOS/tool4d"
      - name: Label evidence tiers and queue policy
        if: always()
        run: |
          {
            echo '## Accepted-worker lifecycle verification — Refs #24'
            echo 'Native response/error notifications keep their timing; queue progression waits until user onTerminate returns, allowing native exit-code abortion before any dependent sideeffect. Default is continue; abortQueue clears all pending queues without native termination.'
            echo 'Required gates: diagnostics-free 20.8 compilation; four fresh compiled reports; clean engine exits.'
            echo 'The original 17 persistent-worker rejection checks still guard clean state BEFORE any reuse.'
            echo 'Accepted-error/interrupted-notification schedules remain manual simulation. Native controls independently verify default continuation, nonzero termination abort before sideeffects, active-worker abort and deliberately resumptive callback-error routing in a surviving owner.'
            echo 'A deliberately resumed callback counts as normal return. Production installs no error handler; the prior failed destructive-ABORT attempt remains a documented owner boundary, not a repeated positive test or a cleanup promise after owner death.'
            echo 'Accepted native error-without-response remains unestablished. Missing-executable POSX2 is synchronous rejection, including when deliberately triggered inside a callback.'
            echo 'Read retained reports and engine exits; a passing JSON report followed by a shutdown crash is a failure, not a runtime pass.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve compiler, execution and candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-characterization-evidence
          path: |
            .build/controller-*/*.json
            .build/controller-*/*.log
            .build/controller-*/engine-version.txt
          include-hidden-files: true
          if-no-files-found: warn
