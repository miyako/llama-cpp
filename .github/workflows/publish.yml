name: Publish

on:
  push:
    branches: [main]
    paths:
      - '*/Project/Sources/**/*.4dm'
      - '*/Project/Sources/*/*.4DForm'
      - '*/Project/Sources/*.4DCatalog'
      - '*/Project/Resources/**'
  workflow_dispatch:
    inputs:
      use_self_hosted:
        type: boolean
        description: Use the existing self-hosted macOS runner
        default: false
      mode:
        type: choice
        description: Normal semantic version increment
        options: [patch, minor, major]
        default: patch
      publish:
        type: boolean
        description: Publish a new release (main only); otherwise sign a private candidate
        default: false

permissions:
  contents: read

concurrency:
  group: component-publisher
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.use_self_hosted && fromJSON('["self-hosted","macos"]') || fromJSON('["macos-latest"]') }}
    timeout-minutes: 40
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      version_commit: ${{ steps.prepare.outputs.version_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test fail-closed gates
        run: python3 -m unittest discover -s tests -p 'test_publisher*.py'
      - name: Prepare local version commit (never push)
        id: prepare
        env:
          MODE: ${{ inputs.mode || 'patch' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/component-release.py prepare --mode "$MODE"
      - name: Get unchanged tool4d configuration
        id: tool
        uses: miyako/4D/.github/actions/tool4d-get-version@2667897263fd24ed5c7840b204cd84c726dd8570
      - name: Get existing tool4d (no runtime upgrade)
        uses: miyako/4D/.github/actions/tool4d-download@2667897263fd24ed5c7840b204cd84c726dd8570
        with:
          platform: ${{ steps.tool.outputs.platform }}
          branch: ${{ steps.tool.outputs.branch }}
          version: ${{ steps.tool.outputs.version }}
          build: ${{ steps.tool.outputs.build }}
          arch: ${{ steps.tool.outputs.arch }}
      - name: Checkout reviewed compiler
        uses: actions/checkout@v4
        with:
          repository: miyako/4d-class-compiler
          ref: b73a89a9eac2636f59bcbd020ccf0aad954cab64
          path: .build/compiler
          persist-credentials: false
      - name: Compile with structured status and retain nonfatal warnings
        run: python3 scripts/component-release.py build
      - name: Sign, notarize, staple and verify actual distribution
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: python3 scripts/sign-component.py
      - name: Recover ephemeral signing credentials
        if: always()
        run: python3 scripts/sign-component.py --cleanup
      - name: Retain sanitized same-run candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-candidate
          path: |
            .build/release/*
            .build/evidence/*
          if-no-files-found: error
          retention-days: 14
      - name: Candidate links
        if: success()
        run: |
          echo '## Signed component candidate' >> "$GITHUB_STEP_SUMMARY"
          echo 'All container, mounted payload and final-byte gates passed. No tag or version was pushed by this job.' >> "$GITHUB_STEP_SUMMARY"
          cat .build/release/provenance.json >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: candidate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: component-candidate
          path: .build/handoff
      - name: Verify same-run bytes, guard source race and publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.candidate.outputs.version }}
          EXPECTED_VERSION_COMMIT: ${{ needs.candidate.outputs.version_commit }}
        run: python3 scripts/component-release.py publish --handoff .build/handoff
